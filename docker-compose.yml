version: '3.8'

services:
  jobspy:
    build:
      context: ./apps/jobspy-service
      dockerfile: Dockerfile
    container_name: kaderadar-jobspy
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: kaderadar-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - JOBSPY_SERVICE_URL=http://jobspy:3002
    volumes:
      - backend-data:/app/data
    depends_on:
      - jobspy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: kaderadar-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-data:
    driver: local
